
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bababansiwalanew'
    compileSdk 35
    defaultConfig {
        applicationId "com.bababansiwalanew"
        minSdk 22
        targetSdk 35
        versionCode 8
        versionName "1.7"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        //   signingConfig signingConfigs.config
        multiDexEnabled true
        useLibrary 'org.apache.http.legacy'

    }


    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }


//
//repositories {
//    flatDir {
//        dirs 'libs'
//    }
//
//}

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.config
        }
    }

    dataBinding {
        enabled = true
    }

    defaultConfig {
        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.2.1'
    implementation 'androidx.activity:activity:1.9.2'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation('com.razorpay:checkout:1.6.18')
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'org.greenrobot:eventbus:3.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
     implementation 'com.google.code.gson:gson:2.8.9'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0' // Latest stable Retrofit version
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0' // Gson converter compatible with Retrofit 2.9.0

    // OkHttp library
    implementation 'com.squareup.okhttp3:okhttp:4.9.1' // Compatible with Retrofit 2.9.0
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1' // Match OkHttp version
    implementation 'com.razorpay:razorpay-java:1.3.8'
    testImplementation 'junit:junit:4.12'
    implementation 'phonepe.intentsdk.android.release:IntentSDK:2.3.0'
    implementation 'com.github.f0ris.sweetalert:library:1.5.3'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation('com.google.android.play:app-update:2.1.0') {
        exclude group: 'com.google.android.play', module: 'core'
    }
    implementation 'com.google.firebase:firebase-messaging:23.2.1'
    implementation 'com.github.rampo.updatechecker:library:2.1.8'
    implementation 'org.jsoup:jsoup:1.10.2'
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
    implementation 'com.github.sharish:ShimmerRecyclerView:v1.3'
    implementation 'com.paytm.appinvokesdk:appinvokesdk:1.6.4'
    implementation 'com.airbnb.android:lottie:3.4.2'
    implementation platform('com.google.firebase:firebase-bom:32.2.0') // Adjust version as needed
    implementation 'com.google.firebase:firebase-installations'






     //implementation 'com.github.JakeWharton:ViewPagerIndicator:2.4.1'
    // implementation 'com.github.Q42:AndroidScrollingImageView:1.2'
      //implementation 'com.android.volley:volley:1.1.0'
     //implementation 'de.hdodenhof:circleimageview:3.1.0'
    //// implementation "com.mlsdev.animatedrv:library:1.0.1"
  //  implementation 'com.github.devlight:infinitecycleviewpager:1.0.2'



}
